<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ — Nguyễn Mạnh Hùng</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --secondary: #06b6d4;
            --dark: #1e1b4b;
            --light: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.95);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #4338ca 0%, #312e81 50%, #1e1b4b 100%);
            min-height: 100vh;
            color: #1f2937;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            width: 100%;
            max-width: 760px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 14px 28px;
            border-radius: 30px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        nav .brand {
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            text-decoration: none;
        }
        nav .links {
            display: flex;
            gap: 20px;
        }
        nav a.nav-link {
            color: #e0e7ff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }
        nav a.nav-link:hover, nav a.nav-link.active {
            color: #38bdf8;
        }
        .container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            max-width: 760px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        h1 {
            color: var(--primary);
            font-size: 26px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .contact-info {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            font-size: 15px;
            color: #334155;
        }
        .contact-item a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .contact-item a:hover {
            text-decoration: underline;
        }
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }
        label {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }
        input, textarea {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="brand">🚀 DevOps Lab 1</a>
        <div class="links">
            <a href="index.html" class="nav-link">Trang chủ</a>
            <a href="about.html" class="nav-link">Giới thiệu</a>
            <a href="contact.html" class="nav-link active">Liên hệ</a>
        </div>
    </nav>

    <div class="container">
        <h1>📬 Thông tin liên hệ</h1>

        <div class="contact-info">
            <div class="contact-item">
                <span>📧</span>
                <span>Email sinh viên: <a href="mailto:dtc235200335@ictu.edu.vn">dtc235200335@ictu.edu.vn</a></span>
            </div>
            <div class="contact-item">
                <span>✉️</span>
                <span>Email cá nhân: <a href="mailto:Manhhungnguyen311@gmail.com">Manhhungnguyen311@gmail.com</a></span>
            </div>
            <div class="contact-item">
                <span>🐙</span>
                <span>GitHub: <a href="https://github.com/nmhung311" target="_blank">github.com/nmhung311</a></span>
            </div>
            <div class="contact-item">
                <span>🏫</span>
                <span>Đơn vị: Khoa Công nghệ Thông tin — Trường ĐH CNTT & TT Thái Nguyên (ICTU)</span>
            </div>
        </div>

        <form class="contact-form" onsubmit="event.preventDefault(); alert('Cảm ơn bạn đã gửi phản hồi!');">
            <div class="form-group">
                <label>Họ và tên của bạn</label>
                <input type="text" placeholder="Nhập họ và tên..." required>
            </div>
            <div class="form-group">
                <label>Nội dung tin nhắn</label>
                <textarea rows="4" placeholder="Nhập nội dung cần trao đổi..." required></textarea>
            </div>
            <button type="submit">Gửi tin nhắn 🚀</button>
        </form>
    </div>
</body>
</html>
